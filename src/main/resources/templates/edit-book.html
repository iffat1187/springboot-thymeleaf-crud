<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Edit Book</title>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>


<!-- Navbar -->

<div th:replace="~{fragments/navbar :: navbar}"></div>



<div class="container page-space">


    <div class="row justify-content-center">


        <div class="col-lg-8">


            <div class="card">


                <!-- Header -->

                <div class="card-header bg-warning text-dark text-center">

                    <i class="bi bi-pencil-square"></i>

                    Edit Book

                </div>



                <div class="card-body">


                    <form th:action="@{/book/update}"
                          th:object="${book}"
                          method="post">


                        <!-- Important for UPDATE -->
                        <!-- Keeps existing database ID -->

                        <input type="hidden"
                               th:field="*{id}">



                        <!-- Title -->

                        <div class="mb-3">

                            <label class="form-label">
                                Book Title
                            </label>


                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{title}">


                            <div class="text-danger"
                                 th:errors="*{title}">
                            </div>

                        </div>




                        <!-- Author -->

                        <div class="mb-3">

                            <label class="form-label">
                                Author
                            </label>


                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{author}">


                            <div class="text-danger"
                                 th:errors="*{author}">
                            </div>

                        </div>




                        <!-- Category -->

                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>


                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{category}">


                            <div class="text-danger"
                                 th:errors="*{category}">
                            </div>

                        </div>




                        <!-- Publisher -->

                        <div class="mb-3">

                            <label class="form-label">
                                Publisher
                            </label>


                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{publisher}">


                            <div class="text-danger"
                                 th:errors="*{publisher}">
                            </div>

                        </div>




                        <!-- ISBN -->

                        <div class="mb-3">

                            <label class="form-label">
                                ISBN
                            </label>


                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{isbn}">


                            <div class="text-danger"
                                 th:errors="*{isbn}">
                            </div>

                        </div>




                        <!-- Language -->

                        <div class="mb-3">

                            <label class="form-label">
                                Language
                            </label>


                            <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{language}">


                            <div class="text-danger"
                                 th:errors="*{language}">
                            </div>

                        </div>




                        <div class="row">


                            <!-- Year -->

                            <div class="col-md-6 mb-3">


                                <label class="form-label">
                                    Published Year
                                </label>


                                <input
                                        type="number"
                                        class="form-control"
                                        th:field="*{publishedYear}">


                                <div class="text-danger"
                                     th:errors="*{publishedYear}">
                                </div>


                            </div>




                            <!-- Price -->

                            <div class="col-md-6 mb-3">


                                <label class="form-label">
                                    Price
                                </label>


                                <input
                                        type="number"
                                        step="0.01"
                                        class="form-control"
                                        th:field="*{price}">


                                <div class="text-danger"
                                     th:errors="*{price}">
                                </div>


                            </div>


                        </div>




                        <!-- Quantity -->

                        <div class="mb-4">


                            <label class="form-label">
                                Quantity
                            </label>


                            <input
                                    type="number"
                                    class="form-control"
                                    th:field="*{quantity}">


                            <div class="text-danger"
                                 th:errors="*{quantity}">
                            </div>


                        </div>




                        <!-- Buttons -->


                        <div class="d-flex justify-content-between">


                            <a th:href="@{/book/list}"
                               class="btn btn-secondary">


                                <i class="bi bi-arrow-left"></i>

                                Cancel

                            </a>



                            <button
                                    type="submit"
                                    class="btn btn-warning">


                                <i class="bi bi-check-circle"></i>

                                Update Book


                            </button>


                        </div>



                    </form>


                </div>


            </div>


        </div>


    </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


<script th:src="@{/js/script.js}"></script>


</body>

</html>
