<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Book List</title>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>


<!-- ==========================
     Navbar
========================== -->

<div th:replace="~{fragments/navbar :: navbar}"></div>



<!-- ==========================
     Main Content
========================== -->

<div class="container page-space">



    <!-- ==========================
         Page Heading
    =========================== -->


    <div class="d-flex justify-content-between align-items-center mb-4">


        <h2>

            <i class="bi bi-journal-bookmark-fill"></i>

            Book List

        </h2>



        <a th:href="@{/book/add}"
           class="btn btn-success">


            <i class="bi bi-plus-circle"></i>

            Add New Book


        </a>


    </div>




    <!-- ==========================
         Search Section
    =========================== -->


    <div class="card shadow-sm mb-4">


        <div class="card-body">


            <form th:action="@{/book/search}"
                  method="get">


                <div class="row g-3">



                    <!-- Search Input -->

                    <div class="col-md-10">


                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search by title or category">


                    </div>



                    <!-- Search Button -->

                    <div class="col-md-2 d-grid">


                        <button type="submit"
                                class="btn btn-primary">


                            <i class="bi bi-search"></i>

                            Search


                        </button>


                    </div>



                </div>


            </form>


        </div>


    </div>





    <!-- ==========================
         No Books Found
    =========================== -->


    <div class="alert alert-warning text-center"
         th:if="${#lists.isEmpty(books)}">


        <i class="bi bi-exclamation-triangle-fill"></i>


        No books found in the library.


    </div>





    <!-- ==========================
         Book Table
    =========================== -->


    <div class="table-responsive"
         th:if="${!#lists.isEmpty(books)}">


        <table class="table table-bordered table-hover align-middle">



            <thead>


            <tr>


                <th>ID</th>

                <th>Title</th>

                <th>Author</th>

                <th>Category</th>

                <th>Publisher</th>

                <th>ISBN</th>

                <th>Language</th>

                <th>Year</th>

                <th>Price</th>

                <th>Quantity</th>

                <th class="text-center">
                    Action
                </th>


            </tr>


            </thead>





            <tbody>


            <tr th:each="book : ${books}">



                <td th:text="${book.id}"></td>


                <td th:text="${book.title}"></td>


                <td th:text="${book.author}"></td>


                <td th:text="${book.category}"></td>


                <td th:text="${book.publisher}"></td>


                <td th:text="${book.isbn}"></td>


                <td th:text="${book.language}"></td>


                <td th:text="${book.publishedYear}"></td>


                <td th:text="${book.price}"></td>


                <td th:text="${book.quantity}"></td>





                <td class="text-center">


                    <!-- Edit Button -->

                    <a th:href="@{/book/edit/{id}(id=${book.id})}"
                       class="btn btn-warning btn-sm">


                        <i class="bi bi-pencil-square"></i>

                        Edit


                    </a>





                    <!-- Delete Button -->


                    <a th:href="@{/book/delete/{id}(id=${book.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirmDelete()">



                        <i class="bi bi-trash"></i>

                        Delete



                    </a>



                </td>



            </tr>


            </tbody>



        </table>



    </div>




</div>





<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap.bundle.min.js"></script>



<!-- Custom JS -->

<script th:src="@{/js/script.js}"></script>



</body>


</html>
