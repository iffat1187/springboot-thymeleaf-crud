<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">


    <title>Dashboard</title>


    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>


<!-- Navbar -->

<div th:replace="~{fragments/navbar :: navbar}"></div>




<div class="container page-space">


    <!-- Page Heading -->

    <div class="mb-4">

        <h2>

            <i class="bi bi-speedometer2"></i>

            Library Dashboard

        </h2>


        <p class="text-muted">

            Overview of your library information

        </p>

    </div>




    <!-- Dashboard Cards -->

    <div class="row g-4">



        <!-- Total Books -->

        <div class="col-md-6 col-lg-3">


            <div class="card shadow-sm border-primary h-100">


                <div class="card-body text-center">


                    <i class="bi bi-book-fill fs-1 text-primary"></i>


                    <h5 class="card-title mt-3">

                        Total Books

                    </h5>


                    <h2 class="fw-bold"
                        th:text="${totalBooks}">

                        0

                    </h2>


                </div>


            </div>


        </div>





        <!-- Total Quantity -->


        <div class="col-md-6 col-lg-3">


            <div class="card shadow-sm border-success h-100">


                <div class="card-body text-center">


                    <i class="bi bi-stack fs-1 text-success"></i>


                    <h5 class="card-title mt-3">

                        Total Quantity

                    </h5>


                    <h2 class="fw-bold"
                        th:text="${totalQuantity}">

                        0

                    </h2>


                </div>


            </div>


        </div>






        <!-- Categories -->


        <div class="col-md-6 col-lg-3">


            <div class="card shadow-sm border-warning h-100">


                <div class="card-body text-center">


                    <i class="bi bi-tags-fill fs-1 text-warning"></i>


                    <h5 class="card-title mt-3">

                        Categories

                    </h5>


                    <h2 class="fw-bold"
                        th:text="${totalCategories}">

                        0

                    </h2>


                </div>


            </div>


        </div>







        <!-- Inventory Value -->


        <div class="col-md-6 col-lg-3">


            <div class="card shadow-sm border-danger h-100">


                <div class="card-body text-center">


                    <i class="bi bi-currency-dollar fs-1 text-danger"></i>


                    <h5 class="card-title mt-3">

                        Inventory Value

                    </h5>


                    <h2 class="fw-bold">


                        $

                        <span th:text="${totalInventoryValue}">
                            0
                        </span>


                    </h2>


                </div>


            </div>


        </div>




    </div>




    <!-- Quick Actions -->


    <div class="mt-5">


        <h4>

            Quick Actions

        </h4>


        <div class="mt-3">


            <a th:href="@{/book/add}"
               class="btn btn-primary me-2">


                <i class="bi bi-plus-circle"></i>

                Add Book


            </a>



            <a th:href="@{/book/list}"
               class="btn btn-secondary">


                <i class="bi bi-list-ul"></i>

                View Books


            </a>


        </div>


    </div>




</div>





<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


<!-- Custom JS -->

<script th:src="@{/js/script.js}"></script>


</body>

</html>
